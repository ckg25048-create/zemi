<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天神駅紹介</title>
    <style>
        :root{
            --my-nav-width: 20%;
        }
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            flex-wrap: wrap;
        } 
        header{
            background-color: antiquewhite;
            width: 100%;
            height: 10vh;
        }
        nav{
            background-color: aqua;
            width: var(--my-nav-width);
            height: 80vh;
        }
        main{
            background-color: burlywood;
            width: calc( 100% - var(--my-nav-width));
            height: 80vh;
        }
        footer{
            background-color: chartreuse;
            width: 100%;
            height: 10vh;
        }
    </style>
</head>
<body>
    <header>
        <div>博多駅紹介</div>
    </header>
    <nav>
        なび
    </nav>
    <main>
        <section>
            <div>博多駅は、毎日多くの人が利用する駅で、交通機関だけでなく観光においても重要な役割を持っています。そこで、博多駅がどのような特徴や魅力があるのか知ってもらいたいと思いこのテーマにしました。
                ターゲット：（想定される閲覧者について）
博多駅を観光として利用する人
博多駅に行ったことがない人

            </div>
        </section>
    </main>
    <footer>
        フッター
    </footer>
</body>
</html>
